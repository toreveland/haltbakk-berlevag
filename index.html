<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haltbakk Bunkers | Berlevåg MGO</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:#fff;background:#071a2c}
.hero{min-height:100vh;background:linear-gradient(rgba(4,20,40,.55),rgba(4,20,40,.75)),url('Fiskebaat.jpg') center/cover;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:900px;width:100%;background:rgba(7,26,44,.85);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:32px;backdrop-filter:blur(8px)}
.logo{max-width:300px;margin-bottom:20px}.price{font-size:72px;font-weight:800;color:#ffd64d}.hidden{display:none}
input{padding:14px;border-radius:10px;border:none;width:240px}button{padding:14px 18px;border:none;border-radius:10px;background:#ffd64d;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.small{color:#cfd8e3}
</style>
</head>
<body>
<div class="hero">
<div class="card">
<div id="login">

<h1>Berlevåg MGO-pris</h1>
<p class="small">Kundeportal for Haltbakk Bunkers</p>
<input id="pw" type="password" placeholder="Passord">
<button onclick="login()">Logg inn</button>
<p id="msg"></p>
</div>
<div id="portal" class="hidden">

<h1>Berlevåg</h1>
<p>Ukens MGO-pris</p>
<div class="price">15,86 kr/l</div>
<p class="small">Gyldig for inneværende uke</p>
<h3>Prisinformasjon</h3>
<p>Prisen beregnes ukentlig basert på gjennomsnittlig MGO-pris siste 7 dager.</p>
<h3>Historikk</h3>
<table><tr><th>Uke</th><th>Pris</th></tr><tr><td>45</td><td>15,86 kr/l</td></tr><tr><td>44</td><td>15,62 kr/l</td></tr><tr><td>43</td><td>15,48 kr/l</td></tr></table>
</div>
</div>
</div>
<script>
function login(){const p=document.getElementById('pw').value;if(p==='haltbakk'){document.getElementById('login').classList.add('hidden');document.getElementById('portal').classList.remove('hidden');}else{document.getElementById('msg').innerText='Feil passord';}}
</script>
</body></html>
